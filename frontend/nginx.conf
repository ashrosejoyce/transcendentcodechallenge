server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend is reachable by its Compose service name on the shared
    # network. Proxying it here keeps the browser talking to a single
    # origin, so the FastAPI app needs no CORS configuration.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document generation calls the Anthropic API twice (RAG + baseline)
        # and can legitimately take a while - don't cut it off early.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
