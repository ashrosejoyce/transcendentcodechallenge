server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static files only - deliberately no /api/ proxy here. The frontend
    # talks to the backend directly and cross-origin (see app.js's
    # API_BASE), so this container doesn't need to know the backend
    # exists at all.
    location / {
        try_files $uri $uri/ =404;
    }
}
